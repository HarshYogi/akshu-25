<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Happy Birthday Akshu 🎂</title>
</head>
<body class="page-landing">
<main class="screen">
  <div class="couple" data-teddy="couple"></div>
  <h2 class="hb display">Happy Birthday</h2>
  <div class="name display">Akshu <span class="badge25">25</span></div>
  <p class="until" id="untilText">Counting down to 30 October</p>
  <div class="count" id="count" role="timer">
    <div class="patch"><b id="cd-d">00</b><small>days</small></div>
    <div class="patch"><b id="cd-h">00</b><small>hours</small></div>
    <div class="patch"><b id="cd-m">00</b><small>mins</small></div>
    <div class="patch"><b id="cd-s">00</b><small>secs</small></div>
  </div>
  <button class="btn" data-go="plan.html">Next 💕</button>
</main>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
