<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Your 25 surprises 🧸</title>
</head>
<body class="page-cards">
<button class="iconbtn homebtn" data-go="landing.html">🏠 Home</button>
<main class="screen cards-screen">
  <div class="topline">
    <h2 class="display cards-title">Your 25 surprises</h2>
    <div class="progress-wrap">
      <div class="progress-text"><span id="progLabel">Opened 0 of 25</span><span id="todayLabel"></span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <button class="iconbtn" id="prev" aria-label="Previous card">‹</button>
    <div class="cardbox" id="cardbox"></div>
    <button class="iconbtn" id="next" aria-label="Next card">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="hint" id="hint"></p>
</main>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/cards.js"></script>
</body>
</html>
